version: 2

updates:
  # `bun`, not `npm`. Bun is its own ecosystem: under `npm` Dependabot bumps
  # package.json and never touches bun.lock, so every PR failed CI on
  # `bun install --frozen-lockfile`. Supported since February 2025 and needs
  # no opt-in flag.
  # Grouped so a week of patch bumps arrives as one PR instead of a dozen.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Actions are pinned to commit SHAs, so this is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

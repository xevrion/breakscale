<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  width="1200"
  height="630"
  role="img"
  aria-label="Breakscale: build a system, load it until it breaks, and watch why"
>
  <title>Breakscale</title>
  <!--
    Social card. 1200x630 is what every scraper crops to, so nothing that
    matters sits within 60px of an edge.

    The card is the KNEE: the curve a system traces as it runs out of
    headroom, flat while there is slack and vertical once there is not. The
    shape is not drawn by eye, it is M/M/1 response time, T = 1/(mu - lambda),
    sampled across the box, so the card carries the curve the simulator
    actually produces.

    The four nodes sit ON the curve and take the app's own status colours,
    green while the system copes, amber at the knee, red past it. That is what
    turns a chart into this product: the reader sees components changing state
    as load rises, which is the thing they will do on the canvas a minute
    later.

    No screenshot: a dense simulator scaled to a timeline thumbnail is
    unreadable. No feature list either, it competes with the one idea.
  -->
  <rect width="1200" height="630" fill="#151419" />

  <!-- The canvas grid, at the app's spacing, kept near invisible. -->
  <g stroke="#232128" stroke-width="1">
    <path d="M0 90.5h1200M0 180.5h1200M0 270.5h1200M0 360.5h1200M0 450.5h1200M0 540.5h1200" />
    <path
      d="M90.5 0v630M180.5 0v630M270.5 0v630M360.5 0v630M450.5 0v630M540.5 0v630M630.5 0v630M720.5 0v630M810.5 0v630M900.5 0v630M990.5 0v630M1080.5 0v630"
    />
  </g>

  <g transform="translate(640, 250)">
    <!-- The rule the curve departs from. Without it the curve is a hook. -->
    <path d="M0 260.5 H500" stroke="#33313c" stroke-width="2" stroke-linecap="round" />
    <path
      d="M0.0 241.4 L80.0 238.0 L160.0 232.7 L220.0 226.8 L260.0 221.3 L300.0 213.5 L340.0 201.9 L360.0 193.7 L380.0 182.6 L400.0 167.1 L420.0 143.9 L440.0 105.2 L460.0 27.8 L468.0 4.0"
      fill="none"
      stroke="#f0656a"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Components on the curve, escalating as headroom runs out. -->
    <circle cx="80" cy="238.0" r="11" fill="#151419" stroke="#4ac06e" stroke-width="5" />
    <circle cx="260" cy="221.3" r="11" fill="#151419" stroke="#4ac06e" stroke-width="5" />
    <circle cx="380" cy="182.6" r="11" fill="#151419" stroke="#d79a2b" stroke-width="5" />
    <circle cx="440" cy="105.2" r="11" fill="#151419" stroke="#f0656a" stroke-width="5" />
  </g>

  <text
    x="96"
    y="300"
    font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
    font-size="82"
    font-weight="700"
    letter-spacing="-1.8"
    fill="#f3f1f5"
  >
    Breakscale
  </text>
  <text
    x="98"
    y="356"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="32"
    fill="#a5a1b0"
  >
    Build a system. Load it until it breaks.
  </text>
  <text
    x="98"
    y="400"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="32"
    fill="#a5a1b0"
  >
    Watch why.
  </text>
</svg>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  width="1200"
  height="630"
  role="img"
  aria-label="Breakscale: build a system, load it until it breaks, and watch why"
>
  <title>Breakscale</title>
  <!--
    Social card. 1200x630 is what every scraper crops to, so nothing that
    matters sits within 60px of an edge.

    The nodes are drawn to the canvas's own anatomy rather than to a
    resemblance of it: 184x88 at rx 6, the header hairline inset 12 to 172 in
    the kind's stroke at 0.28 opacity, the icon at x 12 and the name at x 38,
    the status dot at 168.5, the primary readout at (12,52) in mono 16/650,
    the paired secondaries at y 70, and the 160x3 meter at y 80. The per-kind
    fills, strokes and inks are the dark palette's own values. A reader who
    clicks through meets the same object.

    The story is the one the tool exists to tell, read left to right: traffic
    healthy at the client, the service warm at 86 percent, the database at 100
    with a queue backing up and a third of its work failing. Colour escalates
    with it, which is how the canvas itself reports trouble.

    Not a screenshot: the interface chrome carries none of the meaning and a
    dense simulator does not survive a timeline thumbnail. The readouts are
    illustrative of a state the simulator produces, not a transcript of one
    particular run.
  -->
  <rect width="1200" height="630" fill="#151419"/>
  <g stroke="#232128" stroke-width="1">
    <path d="M0 90.5h1200M0 180.5h1200M0 270.5h1200M0 360.5h1200M0 450.5h1200M0 540.5h1200"/>
    <path d="M90.5 0v630M180.5 0v630M270.5 0v630M360.5 0v630M450.5 0v630M540.5 0v630M630.5 0v630M720.5 0v630M810.5 0v630M900.5 0v630M990.5 0v630M1080.5 0v630"/>
  </g>
  <!-- The mark: the load slider pushed into the red. See public/favicon.svg. -->
  <g transform="translate(94, 112) scale(1.9)">
    <path d="M9 11 H15 V21 H9 A5 5 0 0 1 4 16 A5 5 0 0 1 9 11 Z" fill="#4ac06e"/>
    <rect x="15" y="11" width="5" height="10" fill="#d79a2b"/>
    <path d="M20 11 H23 A5 5 0 0 1 28 16 A5 5 0 0 1 23 21 H20 Z" fill="#f0656a"/>
    <circle cx="24.5" cy="16" r="8" fill="#151419"/>
    <circle cx="24.5" cy="16" r="6" fill="#f0656a"/>
  </g>
  <text x="96" y="248" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="82" font-weight="700" letter-spacing="-1.8" fill="#f3f1f5">Breakscale</text>
  <text x="98" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#a5a1b0">Build a system. Load it until it breaks. Watch why.</text>
  <g transform="translate(236, 356)">
    <path d="M184 44 H266" stroke="#4a4856" stroke-width="2"/>
    <path d="M456 44 H538" stroke="#4a4856" stroke-width="2"/>
    <path d="M264 39 L273 44 L264 49 Z" fill="#5a5866"/>
    <path d="M536 39 L545 44 L536 49 Z" fill="#5a5866"/>
  <g transform="translate(0,0)">
    <rect width="184" height="88" rx="6" fill="#261e3a" stroke="#ac8ff9" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="172" y2="30" stroke="#ac8ff9" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(12,6) scale(0.75)" fill="none" stroke="#d4c7ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h8"/><path d="M10 19v-3.96 3.15"/><path d="M7 19h5"/><rect width="6" height="10" x="16" y="12" rx="2"/></g>
    <text x="38" y="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="450" fill="#eceaf2" dominant-baseline="middle">Client</text>
    <circle cx="168.5" cy="15" r="3.5" fill="#4ac06e"/>
    <text x="12" y="52" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" font-weight="650" fill="#f3f1f5">1.2k<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="650" fill="#d4c7ff" letter-spacing="0.66" dx="4">/s</tspan></text>
    <text x="12" y="70" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#a5a1b0">1.2k/s<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="650" fill="#d4c7ff" letter-spacing="0.6" dx="3">ok</tspan></text>
    <text x="172" y="70" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#a5a1b0">0%<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="650" fill="#d4c7ff" letter-spacing="0.6" dx="3">failing</tspan></text>
    <rect x="12" y="80" width="160" height="3" rx="1.5" fill="#ac8ff9" fill-opacity="0.25"/>
    <rect x="12" y="80" width="158" height="3" rx="1.5" fill="#4ac06e"/>
  </g>
  <g transform="translate(272,0)">
    <rect width="184" height="88" rx="6" fill="#15243c" stroke="#6ea3ff" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="172" y2="30" stroke="#6ea3ff" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(12,6) scale(0.75)" fill="none" stroke="#b5d2ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></g>
    <text x="38" y="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="450" fill="#eceaf2" dominant-baseline="middle">API Server</text>
    <circle cx="168.5" cy="15" r="3.5" fill="#d79a2b"/>
    <text x="12" y="52" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" font-weight="650" fill="#d79a2b">86<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="650" fill="#b5d2ff" letter-spacing="0.66" dx="4">%</tspan></text>
    <text x="12" y="70" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#a5a1b0">104ms<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="650" fill="#b5d2ff" letter-spacing="0.6" dx="3">p99</tspan></text>
    <text x="172" y="70" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#a5a1b0">12<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="650" fill="#b5d2ff" letter-spacing="0.6" dx="3">waiting</tspan></text>
    <rect x="12" y="80" width="160" height="3" rx="1.5" fill="#6ea3ff" fill-opacity="0.25"/>
    <rect x="12" y="80" width="138" height="3" rx="1.5" fill="#d79a2b"/>
  </g>
  <g transform="translate(544,0)">
    <rect width="184" height="88" rx="6" fill="#022839" stroke="#f0656a" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="172" y2="30" stroke="#f0656a" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(12,6) scale(0.75)" fill="none" stroke="#9fdcf5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g>
    <text x="38" y="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="450" fill="#eceaf2" dominant-baseline="middle">Database</text>
    <circle cx="168.5" cy="15" r="3.5" fill="#e2565c"/>
    <text x="12" y="52" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" font-weight="650" fill="#f0656a">100<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="650" fill="#9fdcf5" letter-spacing="0.66" dx="4">%</tspan></text>
    <text x="12" y="70" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#a5a1b0">64<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="650" fill="#9fdcf5" letter-spacing="0.6" dx="3">queued</tspan></text>
    <text x="172" y="70" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#a5a1b0">31%<tspan font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="650" fill="#9fdcf5" letter-spacing="0.6" dx="3">failing</tspan></text>
    <rect x="12" y="80" width="160" height="3" rx="1.5" fill="#f0656a" fill-opacity="0.25"/>
    <rect x="12" y="80" width="160" height="3" rx="1.5" fill="#e2565c"/>
  </g>
  </g>
</svg>
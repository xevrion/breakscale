<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="Breakscale"
>
  <title>Breakscale</title>
  <!--
    Two components and the wire between them: one healthy, one past its
    limit. The smallest true picture of what this tool shows, and the same
    object the canvas and the social card draw, so the tab icon and the
    product read as one thing.

    Colours are the app's own dark palette: service blue for the caller,
    danger red for the one in trouble. The wire steps down rather than
    running straight, which is what puts the failing box lower and gives the
    mark a diagonal at 16px instead of a flat pair.

    Four shapes, no gradients, no filters, nothing finer than 1.6px: it has
    to survive being scaled to 16px in a browser tab.
  -->
  <rect width="32" height="32" rx="7" fill="#1d1c22" />
  <rect x="4" y="7" width="10" height="8" rx="2" fill="#15243c" stroke="#6ea3ff" stroke-width="1.6" />
  <rect x="18" y="17" width="10" height="8" rx="2" fill="#3a1d1f" stroke="#f0656a" stroke-width="1.6" />
  <path
    d="M14 11 H17 a1 1 0 0 1 1 1 V17"
    fill="none"
    stroke="#5a5866"
    stroke-width="1.6"
    stroke-linecap="round"
  />
</svg>

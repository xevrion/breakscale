<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="Breakscale"
>
  <title>Breakscale</title>
  <!--
    The load slider, pushed into the red.

    This is the single gesture the whole product is built around: drag the
    traffic up and watch a system leave the green, pass through the warning,
    and fail. A bar chart or a node diagram says "some tool about systems";
    this says what you DO here.

    Colours are the app's own status ramp (the ok, warn and danger tokens),
    in the order a reader meets them. The thumb takes the danger colour rather than
    a neutral white: a white thumb sat on top of the red segment and hid the
    very thing the mark is about, which was visible only once it was rendered
    at 16px and compared.

    The ring around the thumb is the tile colour, not a stroke. It separates
    the thumb from the track at small sizes, where a 1px outline would either
    vanish or bloom into a smudge.

    Five shapes, no gradients, no filters: it survives a browser tab.
  -->
  <rect width="32" height="32" rx="7" fill="#1d1c22" />
  <path d="M9 11 H15 V21 H9 A5 5 0 0 1 4 16 A5 5 0 0 1 9 11 Z" fill="#4ac06e" />
  <rect x="15" y="11" width="5" height="10" fill="#d79a2b" />
  <path d="M20 11 H23 A5 5 0 0 1 28 16 A5 5 0 0 1 23 21 H20 Z" fill="#f0656a" />
  <circle cx="24.5" cy="16" r="8" fill="#1d1c22" />
  <circle cx="24.5" cy="16" r="6" fill="#f0656a" />
</svg>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="Breakscale"
>
  <title>Breakscale</title>
  <!--
    Load rising until it breaks.

    Three bars climbing, then a fourth that has fractured and toppled: the
    knee in a latency curve, drawn literally. Reads at 16px because it is four
    solid shapes with no strokes, no gradients and no filters, and the break is
    carried by the gap and the tilt rather than by detail that would vanish.

    Colours are the app's own: --ok, --warn and --danger for the escalation,
    --accent for nothing, deliberately, since accent means "you did this" in
    this product and a logo is not an action.
  -->
  <rect x="3" y="20" width="5" height="9" rx="1.2" fill="#187a3b" />
  <rect x="10.5" y="14" width="5" height="15" rx="1.2" fill="#187a3b" />
  <rect x="18" y="8" width="5" height="21" rx="1.2" fill="#945500" />

  <!-- The failed bar: base still standing, top sheared off and fallen. -->
  <rect x="25.5" y="22" width="5" height="7" rx="1.2" fill="#c52b30" />
  <rect
    x="24.9"
    y="4.2"
    width="5"
    height="11"
    rx="1.2"
    fill="#c52b30"
    transform="rotate(24 27.4 9.7)"
  />
</svg>

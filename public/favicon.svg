<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="Breakscale"
>
  <title>Breakscale</title>
  <!--
    The knee: the shape of a latency curve as a system runs out of headroom.

    Flat while there is slack, then vertical once there is not. It is the one
    picture this whole product exists to explain, and it is specific in a way
    a bar chart is not: bars say "analytics", this says "it held, then it
    did not".

    The curve is not drawn by eye. It is M/M/1 response time, T = 1/(mu -
    lambda), sampled and fitted into the box, so the knee sits where the
    theory puts it at about 73 percent utilisation rather than wherever
    looked right.

    The rule beneath is what makes the shape legible: without a baseline the
    curve reads as a floating hook, and at 16px that is all it reads as. It
    is drawn in the border colour so it stays a reference and never competes.

    No gradients, no filters, no strokes finer than the grid: it has to
    survive being scaled to 16px in a browser tab.
  -->
  <rect width="32" height="32" rx="7" fill="#1d1c22" />
  <path d="M4.5 26.5 H27" stroke="#454350" stroke-width="1.6" stroke-linecap="round" />
  <path
    d="M4.5 24 L11 23.6 L16 22.8 L19.6 21.5 L22 19.7 L23.6 17.1 L24.8 12.3 L25.6 6"
    fill="none"
    stroke="#f0656a"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
